[package]
name = "turso_versioning"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Turso versioning extension: prolly-tree chunk store foundation (doltlite-compatible)"

[lints]
workspace = true

[lib]
crate-type = ["lib"]

[features]
bench = []
codspeed = ["bench"]

[dependencies]
blake3 = { version = "1.5.5", features = ["pure"] }
thiserror = "2.0.16"
hex = "0.4"

[dev-dependencies]
tempfile = "3.20.0"
criterion = { workspace = true, features = ["html_reports"] }
codspeed-criterion-compat = { workspace = true, features = ["html_reports"] }
turso_macros.workspace = true

[[bench]]
name = "versioning_bench"
harness = false
